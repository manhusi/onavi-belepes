<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ONavi belépés</title>
<style>
  :root { --bg: #f6f7f9; --text: #1d2330; --muted: #5b6474; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #12151b; --text: #e7eaf0; --muted: #a2abba; } }
  :root[data-theme="dark"] { --bg: #12151b; --text: #e7eaf0; --muted: #a2abba; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg);
         color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  p { color: var(--muted); max-width: 420px; }
</style>
</head>
<body>
<main>
  <h1>ONavi tudáskönyvtár</h1>
  <p>Ez a csatlakozó bejelentkező oldala. A ChatGPT vagy a Claude nyitja meg, amikor a csatlakozót beállítod.</p>
</main>
</body>
</html>
